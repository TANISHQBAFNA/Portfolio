<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Even Ben-Day screens. Density = spacing; size = r. Angles mimic CMYK plates. -->
    <pattern id="paper" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.25" fill="#efe6d6" fill-opacity="0.5"/>
    </pattern>
    <pattern id="redfield" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="4" cy="4" r="1.55" fill="#e8dcc8" fill-opacity="0.72"/>
    </pattern>
    <pattern id="redfield-m" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="4" cy="4" r="1.45" fill="#d44a8c" fill-opacity="0.58"/>
    </pattern>
    <pattern id="redfield-c" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(17) translate(2.2,1.1)">
      <circle cx="4" cy="4" r="0.7" fill="#3aa8b8" fill-opacity="0.32"/>
    </pattern>
    <pattern id="beam" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <circle cx="8" cy="8" r="0.95" fill="#efe6d6" fill-opacity="0.5"/>
    </pattern>
    <pattern id="star-orange" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="7.5" cy="7.5" r="3.05" fill="#f0c14a" fill-opacity="0.78"/>
    </pattern>
    <pattern id="star-hot" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(47) translate(2.6,-1.4)">
      <circle cx="7.5" cy="7.5" r="1.7" fill="#e07a32" fill-opacity="0.4"/>
    </pattern>
    <pattern id="cyan-fence" width="7.5" height="7.5" patternUnits="userSpaceOnUse" patternTransform="rotate(75)">
      <circle cx="3.75" cy="3.75" r="1.35" fill="#4ec4d4" fill-opacity="0.55"/>
    </pattern>
    <pattern id="cyan-m" width="7.5" height="7.5" patternUnits="userSpaceOnUse" patternTransform="rotate(73) translate(-2.1,1.3)">
      <circle cx="3.75" cy="3.75" r="0.62" fill="#d44a8c" fill-opacity="0.28"/>
    </pattern>
    <pattern id="face-mag" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="4.5" cy="4.5" r="1.5" fill="#c43d7a" fill-opacity="0.62"/>
    </pattern>
    <radialGradient id="read" cx="46%" cy="40%" r="38%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="38%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="68%" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="face-falloff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="readable">
      <rect width="1440" height="900" fill="url(#read)"/>
    </mask>
    <mask id="face">
      <ellipse cx="210" cy="160" rx="250" ry="210" fill="url(#face-falloff)"/>
    </mask>
    <mask id="fence-falloff">
      <ellipse cx="1240" cy="730" rx="340" ry="300" fill="url(#face-falloff)"/>
    </mask>
  </defs>

  <g mask="url(#readable)">
    <!-- Base printed paper: even cream screen across the field -->
    <rect width="1440" height="900" fill="url(#paper)"/>

    <!-- "Red field" analog: dense screen filling the left comic plate -->
    <rect x="-40" y="-40" width="560" height="980" fill="url(#redfield)"/>
    <rect x="-40" y="-40" width="560" height="980" fill="url(#redfield-m)"/>
    <ellipse cx="170" cy="430" rx="560" ry="600" fill="url(#redfield-c)"/>

    <!-- Sunbeams: sparser/smaller dots, same idea as yellow rays -->
    <path d="M759.6,406.0 L1491.2,516.6 L1447.2,682.1 L757.3,414.5 Z" fill="url(#beam)"/>
    <path d="M739.9,434.7 L1108.1,1076.6 L951.1,1145.0 L731.9,438.2 Z" fill="url(#beam)"/>
    <path d="M698.1,433.5 L293.1,1052.8 L160.9,943.9 L691.3,427.9 Z" fill="url(#beam)"/>
    <path d="M680.9,391.7 L-43.1,238.6 L10.5,76.0 L683.6,383.4 Z" fill="url(#beam)"/>
    <path d="M707.7,361.9 L480.3,-342.2 L648.0,-376.7 L716.3,360.2 Z" fill="url(#beam)"/>
    <path d="M743.8,367.9 L1184.3,-226.7 L1309.9,-110.3 L750.3,373.8 Z" fill="url(#beam)"/>

    <!-- Explosion starburst: larger yellow-on-orange dots inside the star -->
    <polygon points="720.0,-120.0 784.2,181.2 1001.1,-37.5 892.3,250.7 1193.0,184.0 945.7,367.6 1234.7,474.0 927.4,494.7 1113.0,740.5 843.3,591.8 866.5,898.9 720.0,628.0 573.5,898.9 596.7,591.8 327.0,740.5 512.6,494.7 205.3,474.0 494.3,367.6 247.0,184.0 547.7,250.7 438.9,-37.5 655.8,181.2" fill="#c45a20" fill-opacity="0.18"/>
    <polygon points="720.0,-120.0 784.2,181.2 1001.1,-37.5 892.3,250.7 1193.0,184.0 945.7,367.6 1234.7,474.0 927.4,494.7 1113.0,740.5 843.3,591.8 866.5,898.9 720.0,628.0 573.5,898.9 596.7,591.8 327.0,740.5 512.6,494.7 205.3,474.0 494.3,367.6 247.0,184.0 547.7,250.7 438.9,-37.5 655.8,181.2" fill="url(#star-orange)"/>
    <polygon points="720.0,100.0 757.2,273.3 882.2,147.6 819.8,313.6 992.9,275.4 850.7,381.2 1016.9,442.7 840.1,454.8 946.7,596.5 791.4,511.0 804.5,687.8 720.0,532.0 635.5,687.8 648.6,511.0 493.3,596.5 599.9,454.8 423.1,442.7 589.3,381.2 447.1,275.4 620.2,313.6 557.8,147.6 682.8,273.3" fill="url(#star-hot)"/>

    <!-- Miles-style face panel: same grid, density via radial mask -->
    <ellipse cx="210" cy="160" rx="250" ry="210" fill="url(#face-mag)" mask="url(#face)"/>

    <!-- Fence / industrial panel: large uniform cyan grid -->
    <ellipse cx="1240" cy="730" rx="340" ry="300" fill="url(#cyan-fence)" mask="url(#fence-falloff)"/>
    <ellipse cx="1240" cy="730" rx="300" ry="260" fill="url(#cyan-m)" mask="url(#fence-falloff)"/>
  </g>
</svg>
