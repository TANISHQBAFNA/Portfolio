<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" fill="none">
  <defs>
    <!-- Same-grid screens; density = spacing + radius inside each silhouette -->
    <pattern id="field" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <circle cx="4" cy="4" r="1.55" fill="#1a1214"/>
    </pattern>
    <pattern id="beam" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.85" fill="#1a1214" fill-opacity="0.55"/>
    </pattern>
    <pattern id="star-mid" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="6.5" cy="6.5" r="2.35" fill="#f5e15a"/>
    </pattern>
    <pattern id="star-hot" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(47) translate(2.4,-1.2)">
      <circle cx="5.5" cy="5.5" r="2.7" fill="#ffe98a"/>
    </pattern>
    <pattern id="star-edge" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(43)">
      <circle cx="7.5" cy="7.5" r="1.35" fill="#f5e15a" fill-opacity="0.7"/>
    </pattern>
    <radialGradient id="core-fall" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="42%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="78%" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dense-core">
      <ellipse cx="500.0" cy="430.0" rx="210" ry="190" fill="url(#core-fall)"/>
    </mask>
    <mask id="mid-core">
      <ellipse cx="500.0" cy="430.0" rx="320" ry="290" fill="url(#core-fall)"/>
    </mask>
    <clipPath id="burst-clip">
      <polygon points="500.0,16.3 547.5,252.7 690.1,100.7 615.1,314.9 867.3,217.9 673.1,383.6 870.9,430.0 662.1,473.4 874.9,646.4 621.6,551.6 683.8,748.3 545.5,600.0 500.0,858.7 457.2,589.7 312.4,754.9 372.0,558.0 135.6,640.4 345.1,471.5 114.0,430.0 320.6,381.9 149.7,227.8 388.3,318.3 297.8,79.8 452.1,251.4"/>
    </clipPath>
  </defs>

  <!-- Red-field analog: dense black-on-ink screens filling beam gaps -->
  <g fill="url(#field)" opacity="0.55">
    <path d="M536.0,428.7 L1150.0,315.4 L1156.4,499.0 Z"/><path d="M527.6,453.1 L1020.0,767.7 L922.8,883.4 Z"/><path d="M466.2,417.7 L-89.0,315.5 L-24.8,139.1 Z"/><path d="M493.7,394.5 L342.1,-86.4 L471.7,-109.3 Z"/>
  </g>

  <!-- Sparse beam wedges aiming at the shout -->
  <g fill="#f5e15a" fill-opacity="0.22" stroke="#0e1018" stroke-width="5" stroke-linejoin="miter">
    <path d="M533.4,416.5 L1062.4,124.6 L1116.7,259.0 Z"/><path d="M534.2,441.1 L1095.5,562.0 L1059.4,673.2 Z"/><path d="M516.9,461.8 L813.1,894.3 L709.8,949.2 Z"/><path d="M483.1,461.8 L289.0,927.1 L205.9,882.9 Z"/><path d="M464.8,437.5 L-51.6,609.2 L-76.8,490.6 Z"/><path d="M507.5,394.8 L560.0,-96.6 L659.4,-75.5 Z"/><path d="M475.9,403.2 L127.0,82.2 L193.1,22.7 Z"/>
  </g>
  <g fill="url(#beam)" opacity="0.85">
    <path d="M533.4,416.5 L1062.4,124.6 L1116.7,259.0 Z"/><path d="M534.2,441.1 L1095.5,562.0 L1059.4,673.2 Z"/><path d="M516.9,461.8 L813.1,894.3 L709.8,949.2 Z"/><path d="M483.1,461.8 L289.0,927.1 L205.9,882.9 Z"/><path d="M464.8,437.5 L-51.6,609.2 L-76.8,490.6 Z"/><path d="M507.5,394.8 L560.0,-96.6 L659.4,-75.5 Z"/><path d="M475.9,403.2 L127.0,82.2 L193.1,22.7 Z"/>
  </g>

  <!-- Motion lines clipped to the burst energy -->
  <g stroke="#0e1018" stroke-width="1.35" stroke-opacity="0.55" stroke-linecap="square" clip-path="url(#burst-clip)">
    <line x1="589.1" y1="417.5" x2="906.0" y2="372.9"/><line x1="588.6" y1="445.6" x2="903.8" y2="501.2"/><line x1="579.5" y1="472.3" x2="862.0" y2="622.5"/><line x1="562.5" y1="494.7" x2="784.8" y2="724.9"/><line x1="539.5" y1="510.9" x2="679.7" y2="798.5"/><line x1="512.5" y1="519.1" x2="557.1" y2="836.0"/><line x1="484.4" y1="518.6" x2="428.8" y2="833.8"/><line x1="457.7" y1="509.5" x2="307.5" y2="792.0"/><line x1="435.3" y1="492.5" x2="205.1" y2="714.8"/><line x1="419.1" y1="469.5" x2="131.5" y2="609.7"/><line x1="410.9" y1="442.5" x2="94.0" y2="487.1"/><line x1="411.4" y1="414.4" x2="96.2" y2="358.8"/><line x1="420.5" y1="387.7" x2="138.0" y2="237.5"/><line x1="437.5" y1="365.3" x2="215.2" y2="135.1"/><line x1="460.5" y1="349.1" x2="320.3" y2="61.5"/><line x1="487.5" y1="340.9" x2="442.9" y2="24.0"/><line x1="515.6" y1="341.4" x2="571.2" y2="26.2"/><line x1="542.3" y1="350.5" x2="692.5" y2="68.0"/><line x1="564.7" y1="367.5" x2="794.9" y2="145.2"/><line x1="580.9" y1="390.5" x2="868.5" y2="250.3"/>
  </g>

  <!-- Outer starburst: orange plate, sparse yellow screen at the fringe -->
  <polygon points="500.0,16.3 547.5,252.7 690.1,100.7 615.1,314.9 867.3,217.9 673.1,383.6 870.9,430.0 662.1,473.4 874.9,646.4 621.6,551.6 683.8,748.3 545.5,600.0 500.0,858.7 457.2,589.7 312.4,754.9 372.0,558.0 135.6,640.4 345.1,471.5 114.0,430.0 320.6,381.9 149.7,227.8 388.3,318.3 297.8,79.8 452.1,251.4" fill="#c45a20" fill-opacity="0.92" stroke="#0e1018" stroke-width="10" stroke-linejoin="miter"/>
  <polygon points="500.0,16.3 547.5,252.7 690.1,100.7 615.1,314.9 867.3,217.9 673.1,383.6 870.9,430.0 662.1,473.4 874.9,646.4 621.6,551.6 683.8,748.3 545.5,600.0 500.0,858.7 457.2,589.7 312.4,754.9 372.0,558.0 135.6,640.4 345.1,471.5 114.0,430.0 320.6,381.9 149.7,227.8 388.3,318.3 297.8,79.8 452.1,251.4" fill="url(#star-edge)"/>

  <!-- Mid burst: same grid, denser yellow dots -->
  <polygon points="500.0,169.0 531.9,310.8 623.2,216.6 580.4,349.6 730.0,297.2 617.2,398.6 742.2,430.0 612.1,460.0 733.3,564.7 583.4,513.4 620.4,638.5 531.0,545.8 500.0,697.6 470.3,540.9 377.9,641.4 413.6,516.4 271.3,562.1 391.3,459.1 251.1,430.0 379.8,397.8 277.5,301.5 421.2,351.2 371.5,207.5 467.9,310.1" fill="#e07a32" stroke="#0e1018" stroke-width="7" stroke-linejoin="miter"/>
  <polygon points="500.0,169.0 531.9,310.8 623.2,216.6 580.4,349.6 730.0,297.2 617.2,398.6 742.2,430.0 612.1,460.0 733.3,564.7 583.4,513.4 620.4,638.5 531.0,545.8 500.0,697.6 470.3,540.9 377.9,641.4 413.6,516.4 271.3,562.1 391.3,459.1 251.1,430.0 379.8,397.8 277.5,301.5 421.2,351.2 371.5,207.5 467.9,310.1" fill="url(#star-mid)" mask="url(#mid-core)"/>

  <!-- Hot core: largest dots, concentrated light -->
  <polygon points="500.0,299.8 516.6,368.1 562.4,321.9 542.7,387.3 614.2,364.1 561.1,413.6 623.3,430.0 559.2,445.9 615.4,496.6 543.8,473.8 561.4,536.4 516.2,490.6 500.0,562.6 484.3,488.7 438.0,537.4 455.0,475.0 386.3,495.7 442.1,445.5 374.2,430.0 437.7,413.3 388.5,365.6 457.9,387.9 435.6,318.5 483.4,367.9" fill="#f5e15a" stroke="#0e1018" stroke-width="6" stroke-linejoin="miter"/>
  <polygon points="500.0,299.8 516.6,368.1 562.4,321.9 542.7,387.3 614.2,364.1 561.1,413.6 623.3,430.0 559.2,445.9 615.4,496.6 543.8,473.8 561.4,536.4 516.2,490.6 500.0,562.6 484.3,488.7 438.0,537.4 455.0,475.0 386.3,495.7 442.1,445.5 374.2,430.0 437.7,413.3 388.5,365.6 457.9,387.9 435.6,318.5 483.4,367.9" fill="url(#star-hot)" mask="url(#dense-core)"/>

  <!-- Innermost flash -->
  <polygon points="500.0,357.1 512.0,393.0 541.5,372.8 530.1,408.1 570.0,407.2 538.6,430.0 566.6,451.6 530.5,452.1 543.6,490.0 511.7,466.1 500.0,499.8 488.2,466.5 456.5,489.8 469.7,452.0 433.1,451.7 461.3,430.0 430.2,407.3 470.0,408.2 458.2,372.5 487.9,392.8" fill="#fff4c2" stroke="#0e1018" stroke-width="4" stroke-linejoin="miter"/>
</svg>
