  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Tanishq Bafna",
    "url": "https://tanishqbafna.com/",

    "description": "Product and UX designer focused on fintech platforms, complex financial products, and design systems.",
    "knowsAbout": ["Fintech", "Product Design", "UX Design", "Design Systems", "AI products"],

  }
  </script>

  <script>
    (function () {
      try {
        try { localStorage.removeItem('tb-theme'); } catch (e) { }
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('is-dark');
        else document.documentElement.classList.remove('is-dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1E1510' : '#f4efe6');
      } catch (e) { }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=block" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=block" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/landing.css?v=hz102" />
</head>

<body class="landing">
  <a class="skip-link" href="#work">Skip to work</a>

  <div class="curtain" id="curtain" aria-hidden="true">
    <div class="curtain__brand">
      <p class="curtain__mark" id="curtain-mark"></p>
    </div>
  </div>

  <!-- ambient material layers: grain, vignette, cursor light -->
  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere__wash"></div>
    <div class="atmosphere__desk"></div>
    <div class="atmosphere__light" data-cursor-light></div>
    <canvas class="atmosphere__particles" data-particles aria-hidden="true"></canvas>
    <div class="atmosphere__grain"></div>
  </div>

  <div class="stage is-home" data-stage>

    <!-- ── PortfolioHeader ───────────────────────────────────────── -->
    <header class="masthead">
      <div class="masthead__identity">
        <a class="masthead__name" href="index.html">Tanishq Bafna</a>
      </div>


      <nav class="masthead__nav" aria-label="Primary">
        <ul>
          <li><a href="#project-detail" data-nav-work><span class="masthead__nav-num" aria-hidden="true">01</span><span
                class="masthead__nav-label">Work</span></a></li>
          <li><a href="about.html"><span class="masthead__nav-num" aria-hidden="true">02</span><span
                class="masthead__nav-label">About</span></a></li>
          <li><a href="resume.pdf"><span class="masthead__nav-num" aria-hidden="true">03</span><span
                class="masthead__nav-label">Resume</span></a></li>
        </ul>
      </nav>

      <!-- case-study progress: sits on the header's lower edge, so it tracks the
           bar's height at every breakpoint. Hidden on the landing. -->
      <div class="deck-progress" data-deck-progress hidden aria-hidden="true">
        <span class="deck-progress__fill" data-deck-progress-fill></span>
      </div>
    </header>

    <!-- ── HeroIntro ─────────────────────────────────────────────── -->
    <section class="hero" data-hero aria-labelledby="hero-heading">
      <div class="hero__type">
        <p class="hero__role reveal">Product Designer <span aria-hidden="true">/</span> UX Designer</p>
        <h1 class="hero__heading reveal" id="hero-heading">
          <span class="hero__kicker">I DESIGN</span>
          <span class="hero__display">
            <span class="hero__accent">THOUGHTFUL</span>
            <span class="hero__word">EXPERIENCES</span>
          </span>
        </h1>
        <p class="hero__support reveal">
          At the intersection of people and technology<br>
          through first-principles thinking.
        </p>
      </div>

      <figure class="portrait" data-portrait hidden>
        <div class="portrait__frame">
          <img class="portrait__img" src="assets/img/tanishq-portrait.png" alt="Tanishq Bafna" width="880" height="1100"
            decoding="async" fetchpriority="high" />
        </div>
      </figure>
    </section>

    <button type="button" class="theme-tab" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode">
      <span class="theme-tab__icon theme-tab__icon--moon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M20.4 14.6A8.4 8.4 0 0 1 9.4 3.6 8.6 8.6 0 1 0 20.4 14.6z" />
        </svg>
      </span>
      <span class="theme-tab__icon theme-tab__icon--sun" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.1" />
          <path
            d="M12 3.2v1.7M12 19.1v1.7M4.9 4.9l1.2 1.2M17.9 17.9l1.2 1.2M3.2 12h1.7M19.1 12h1.7M4.9 19.1l1.2-1.2M17.9 6.1l1.2-1.2" />
        </svg>
      </span>
    </button>

    <!-- ── ProjectDetail: centered manila folder / flip book ──── -->
    <section class="detail detail--folder" id="project-detail" data-detail data-case hidden
      aria-labelledby="detail-title">
      <div class="detail__card" data-detail-card hidden></div>
      <h2 class="detail__title" id="detail-title" data-detail-title tabindex="-1"></h2>

      <div class="case-folder" data-case-folder>
        <div class="case-folder__shell" data-case-shell data-tone="kraft">
          <div class="case-folder__tab" aria-hidden="true">
            <span data-case-face-year></span>
          </div>

          <div class="case-folder__book" data-case-book>
            <div class="book" data-book>
              <div class="book__left">
                <div class="case-page case-page--text" data-left-page></div>
              </div>
              <div class="book__spine" aria-hidden="true"></div>
              <div class="book__right">
                <div class="book__under" data-under-page></div>
                <div class="book__leaf" data-leaf>
                  <div class="book__face book__face--front" data-front-page></div>
                  <div class="book__face book__face--back" data-back-page></div>
                  <span class="book__edge" aria-hidden="true"></span>
                </div>
                <div class="book__stack" aria-hidden="true">
                  <span></span><span></span><span></span>
                </div>
              </div>
            </div>
          </div>

          <div class="case-folder__cover" data-case-cover aria-hidden="true">
            <span class="case-folder__clip" aria-hidden="true"></span>
            <p class="case-folder__stamp" data-case-cover-stamp>Case file</p>
            <p class="case-folder__face-cat" data-case-cover-cat></p>
            <p class="case-folder__face-title" data-case-cover-title></p>
            <p class="case-folder__hook" data-case-cover-hook></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ── HorizontalNavigation ──────────────────────────────────── -->
    <div class="rail-controls" data-rail-controls>
      <button class="rail-btn rail-btn--home" type="button" data-rail-home aria-label="Back to all projects" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 11.5 12 4l8 7.5M6.5 10v9h11v-9" />
        </svg>
      </button>


      <div class="rail-controls__buttons">
        <button class="rail-btn" type="button" data-rail-prev aria-label="Previous project" aria-controls="work">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 5 8 12l7 7" />
          </svg>
        </button>
        <p class="rail-controls__counter" data-rail-counter hidden>
          <span class="rail-controls__beat" data-rail-beat-name></span>
          <span class="rail-controls__nums">
            <span data-rail-counter-current>01</span> / <span data-rail-counter-total>03</span>
          </span>
        </p>
        <button class="rail-btn" type="button" data-rail-next aria-label="Next project" aria-controls="work">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Work (heading is visually hidden; screen readers only) ── -->
    <section class="rail bento" id="work" aria-labelledby="work-heading" data-rail>
      <h2 class="visually-hidden" id="work-heading">Work</h2>
      <ol class="rail__track" data-rail-track></ol>
    </section>

    <noscript>
      <ul class="rail__fallback">
        <li>01 - SME Banking</li>
        <li>02 - AI workflow</li>
        <li>03 - Plootus</li>
        <li>04 - Daughters</li>
      </ul>
    </noscript>

    <p class="rail-status visually-hidden" role="status" aria-live="polite" data-rail-status></p>
  </div>

  <div class="scroll-run" aria-hidden="true"></div>

  <!-- Work card markup -->
  <template id="folder-template">
    <li class="folder-slot">
      <a class="work-card" href="#project-detail" data-folder>
        <span class="work-card__media" aria-hidden="true">
          <img class="work-card__img" alt="" width="720" height="1100" decoding="async" />
        </span>
        <span class="work-card__cap">
          <span class="work-card__title"></span>
          <span class="work-card__caption"></span>
        </span>
      </a>
    </li>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="assets/js/iris-motion.js?v=hz97" defer></script>
  <script src="assets/js/project-data.js?v=hz97" defer></script>
  <script src="assets/js/folder-card.js?v=hz97" defer></script>
  <script src="assets/js/project-rail.js?v=hz97" defer></script>
  <script src="assets/js/project-detail.js?v=hz97" defer></script>
  <script src="assets/js/landing.js?v=hz102" defer></script>
  <script>window.__GTM_ID__ = 'GTM-XXXXXXX';</script>
  <script src="assets/js/tracking.js"></script>
</body>

</html>
